<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><title>JOY EXTREME · WF Sales</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:18px 16px 90px}header{display:flex;justify-content:space-between;align-items:end;margin:6px 0 18px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#777}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px}.num{font-size:25px;font-weight:700}.label{font-size:12px;color:#777;margin-top:4px}.scanner{margin-top:12px;background:#111;border-radius:18px;overflow:hidden;position:relative;min-height:230px;display:grid;place-items:center;color:#fff}video{width:100%;height:260px;object-fit:cover;display:none}.scanline{position:absolute;left:10%;right:10%;top:50%;border-top:2px solid #fff;opacity:.8}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;background:#111;color:#fff}.btn.secondary{background:#eee;color:#111}.btn.danger{background:#eee;color:#a00}.scanbtn{position:absolute;bottom:16px}.search{display:flex;gap:8px;margin-top:12px}.search input{flex:1;border:1px solid #ccc;border-radius:12px;padding:13px;font-size:16px;background:#fff}.section{margin-top:20px}.section h2{font-size:15px;margin:0 0 9px}.item{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item b{display:block;font-size:14px}.meta{font-size:12px;color:#777;margin-top:3px}.stock{font-weight:700;white-space:nowrap}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:10}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 5px}.ean{font-family:monospace;color:#777}.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:18px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:20;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;padding:9px 11px}.empty{color:#888;font-size:13px;padding:10px 2px}footer{margin-top:25px;color:#999;font-size:11px;text-align:center}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px;max-width:520px}}
</style></head><body><div class="app"><header><div><h1>JOY EXTREME · WF SALES</h1><div class="sub">扫码 / 品名搜索 · 本机库存记录</div></div><button class="btn secondary small" onclick="exportCSV()">导出流水</button></header>
<div class="stats"><div class="card"><div class="num" id="soldN">0</div><div class="label">已售</div></div><div class="card"><div class="num" id="remainN">0</div><div class="label">剩余可售</div></div><div class="card"><div class="num" id="skuN">0</div><div class="label">SKU</div></div></div>
<div class="scanner"><video id="video" playsinline></video><div id="scanHelp">点击下方按钮，用手机摄像头读取 EAN-13</div><div class="scanline"></div><button class="btn scanbtn" id="scanBtn" onclick="toggleScan()">开始扫码</button></div>
<div class="search"><input id="q" placeholder="输入品名 / SKU / EAN" oninput="renderProducts()"><button class="btn secondary" onclick="document.getElementById('q').value='';renderProducts()">清空</button></div>
<div class="section"><h2>商品库存</h2><div id="products"></div></div>
<div class="section"><h2>最近销售</h2><div id="sales"></div><div class="toolbar"><button class="btn secondary small" onclick="undoLast()">撤销上一笔</button><button class="btn danger small" onclick="resetData()">重置本机数据</button></div></div><footer>数据默认保存在当前设备浏览器。首次正式使用前请做一次扫码与导出测试。</footer></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3 id="mName"></h3><div class="ean" id="mCode"></div><p id="mInfo"></p><div class="actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn" id="sellBtn" onclick="confirmSale()">确认售出 1 件</button></div></div></div><div class="toast" id="toast"></div>
<script src="./zxing-browser.min.js"></script>
<script>
const seed = [{"id": "p01", "name": "蝠鲼白色成品", "initial": 3, "remaining": 3, "sku": "MR0536-W-E1", "ean": "6976906830086"}, {"id": "p02", "name": "蝠鲼蓝色成品", "initial": 5, "remaining": 5, "sku": "MR0536-B-E1", "ean": "6976906830000"}, {"id": "p03", "name": "蝠鲼原色拼装", "initial": 3, "remaining": 3, "sku": "MR0536-P-E2", "ean": "6976906830024"}, {"id": "p04", "name": "蝠鲼原色成品", "initial": 3, "remaining": 3, "sku": "MR0536-P-E1", "ean": "6976906830017"}, {"id": "p05", "name": "蝠鲼蓝色拼装", "initial": 10, "remaining": 10, "sku": "MR0536-B-E2", "ean": "6976906836668"}, {"id": "p06", "name": "蝠鲼白色拼装", "initial": 3, "remaining": 3, "sku": "MR0536-W-E2", "ean": "6976906830079"}, {"id": "p07", "name": "蝠鲼黑色拼装", "initial": 3, "remaining": 3, "sku": "MR0536-D-E2", "ean": "6976906830178"}, {"id": "p08", "name": "蝠鲼黑色成品", "initial": 3, "remaining": 3, "sku": "MR0536-D-E1", "ean": "6976906830161"}, {"id": "p09", "name": "鹦鹉螺白色拼装", "initial": 8, "remaining": 8, "sku": "NAU0537-W-E2", "ean": "6976906830048"}, {"id": "p10", "name": "鹦鹉螺白色成品", "initial": 3, "remaining": 3, "sku": "NAU0537-W-E1", "ean": "6976906830031"}, {"id": "p11", "name": "鹦鹉螺原色拼装", "initial": 5, "remaining": 5, "sku": "NAU0537-P-E2", "ean": "6976906830062"}, {"id": "p12", "name": "鹦鹉螺原色成品", "initial": 3, "remaining": 3, "sku": "NAU0537-P-E1", "ean": "6976906830055"}, {"id": "p13", "name": "雕刻鹦鹉螺", "initial": 0, "remaining": 0, "sku": "", "ean": ""}, {"id": "p14", "name": "战损蝠鲼", "initial": 1, "remaining": 1, "sku": "", "ean": ""}, {"id": "p15", "name": "金色鲸鱼", "initial": 0, "remaining": 0, "sku": "", "ean": ""}, {"id": "p16", "name": "纹理版鹦鹉螺", "initial": 9, "remaining": 9, "sku": "NAU0537-V-E1", "ean": "6976906830253"}, {"id": "p17", "name": "机械海龟原色成品", "initial": 0, "remaining": 0, "sku": "CC0539-P-E1", "ean": "6976906830307"}, {"id": "p18", "name": "机械海龟白色成品", "initial": 0, "remaining": 0, "sku": "", "ean": ""}, {"id": "p19", "name": "机械海龟红色产品", "initial": 0, "remaining": 0, "sku": "", "ean": ""}, {"id": "p20", "name": "机械鲸鱼金属原色中文产品", "initial": 0, "remaining": 0, "sku": "", "ean": ""}, {"id": "p21", "name": "15cm蝠鲼", "initial": 0, "remaining": 0, "sku": "", "ean": ""}, {"id": "p22", "name": "15cm鹦鹉螺", "initial": 0, "remaining": 0, "sku": "", "ean": ""}, {"id": "p23", "name": "15cm海龟", "initial": 0, "remaining": 0, "sku": "", "ean": ""}, {"id": "p24", "name": "15cm鲸鱼", "initial": 0, "remaining": 0, "sku": "", "ean": ""}];
let products=JSON.parse(localStorage.getItem('jx_products')||'null')||seed;
let sales=JSON.parse(localStorage.getItem('jx_sales')||'[]'); let selected=null; let stream=null; let scanning=false; let detector=null; let zxingControls=null;
function save(){localStorage.setItem('jx_products',JSON.stringify(products));localStorage.setItem('jx_sales',JSON.stringify(sales));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let sold=sales.filter(x=>!x.void).length;document.getElementById('soldN').textContent=sold;document.getElementById('remainN').textContent=products.reduce((a,p)=>a+p.remaining,0);document.getElementById('skuN').textContent=products.length;renderProducts();renderSales()}
function renderProducts(){let q=document.getElementById('q').value.trim().toLowerCase();let arr=products.filter(p=>!q||[p.name,p.sku,p.ean].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('products').innerHTML=arr.length?arr.map(p=>`<div class="item" onclick="openProduct('${p.id}')"><div><b>${esc(p.name)}</b><div class="meta">${esc(p.sku||'无SKU')} · ${esc(p.ean||'无EAN')} · 初始可售 ${p.initial}</div></div><div class="stock">剩 ${p.remaining}</div></div>`).join(''):'<div class="empty">没有匹配商品</div>'}
function renderSales(){let arr=sales.filter(x=>!x.void).slice(-8).reverse();document.getElementById('sales').innerHTML=arr.length?arr.map(s=>`<div class="item"><div><b>${esc(s.name)}</b><div class="meta">${new Date(s.time).toLocaleString('zh-CN',{hour12:false})}</div></div><div>×1</div></div>`).join(''):'<div class="empty">还没有销售记录</div>'}
function openProduct(id){selected=products.find(p=>p.id===id);document.getElementById('mName').textContent=selected.name;document.getElementById('mCode').textContent=[selected.sku,selected.ean].filter(Boolean).join(' · ');document.getElementById('mInfo').textContent=`初始可售 ${selected.initial} · 已售 ${selected.initial-selected.remaining} · 剩余 ${selected.remaining}`;document.getElementById('sellBtn').disabled=selected.remaining<=0;document.getElementById('sellBtn').textContent=selected.remaining>0?'确认售出 1 件':'库存为 0';document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none';selected=null}
function confirmSale(){if(!selected||selected.remaining<=0)return;let soldName=selected.name;selected.remaining--;sales.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'',productId:selected.id,name:selected.name,ean:selected.ean,sku:selected.sku,time:new Date().toISOString(),void:false});save();closeModal();toast('已记录：'+soldName)}
function undoLast(){let s=[...sales].reverse().find(x=>!x.void);if(!s)return toast('没有可撤销记录');let p=products.find(x=>x.id===s.productId);if(p)p.remaining++;s.void=true;save();toast('已撤销上一笔')}
function resetData(){if(!confirm('确定清空本机销售记录并恢复初始库存？'))return;products=JSON.parse(JSON.stringify(seed));sales=[];save();toast('已恢复初始库存')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function onBarcode(code){let p=products.find(x=>x.ean===code);if(p){navigator.vibrate?.(80);stopScan();openProduct(p.id)}else{toast('未找到 EAN：'+code)}}
async function toggleScan(){if(scanning){stopScan();return}if(!navigator.mediaDevices?.getUserMedia){toast('此浏览器无法使用摄像头，请检查 HTTPS 与浏览器权限');return}try{let v=document.getElementById('video');v.style.display='block';scanning=true;document.getElementById('scanBtn').textContent='停止扫码';if('BarcodeDetector'in window){detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});v.srcObject=stream;await v.play();scanLoop();return}if(window.ZXingBrowser?.BrowserMultiFormatReader){let reader=new ZXingBrowser.BrowserMultiFormatReader();zxingControls=await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},v,(result,error)=>{if(result&&scanning)onBarcode(result.getText())});stream=v.srcObject;return}throw new Error('scanner unsupported')}catch(e){stopScan();toast('无法打开扫码器，请检查摄像头权限或网络连接')}}
async function scanLoop(){if(!scanning)return;try{let codes=await detector.detect(document.getElementById('video'));if(codes.length){let code=codes[0].rawValue;let p=products.find(x=>x.ean===code);if(p){navigator.vibrate?.(80);stopScan();openProduct(p.id)}else{toast('未找到 EAN：'+code);await new Promise(r=>setTimeout(r,1000))}}}catch(e){}requestAnimationFrame(scanLoop)}
function stopScan(){scanning=false;if(zxingControls){zxingControls.stop();zxingControls=null}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;document.getElementById('video').srcObject=null;document.getElementById('video').style.display='none';document.getElementById('scanBtn').textContent='开始扫码'}
function exportCSV(){let rows=[['时间','EAN','SKU','品名','数量','状态'],...sales.map(s=>[s.time,s.ean||'',s.sku||'',s.name,1,s.void?'已撤销':'有效'])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='JOY_EXTREME_WF_销售流水.csv';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
