<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>JOY EXTREME · WF Sales</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:18px 16px 90px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 18px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#777}.header-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px}.num{font-size:25px;font-weight:700}.label{font-size:12px;color:#777;margin-top:4px}.status{margin-top:10px;padding:9px 12px;border-radius:12px;background:#eaf6ed;color:#245c2c;font-size:12px}.status.error{background:#fff0f0;color:#9d1c1c}.status.syncing{background:#fff8e5;color:#745500}.scanner{margin-top:12px;background:#111;border-radius:18px;overflow:hidden;position:relative;min-height:230px;display:grid;place-items:center;color:#fff;text-align:center;padding:20px}video{width:100%;height:260px;object-fit:cover;display:none}.scanline{position:absolute;left:10%;right:10%;top:50%;border-top:2px solid #fff;opacity:.8}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;background:#111;color:#fff;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#eee;color:#111}.btn.danger{background:#eee;color:#a00}.scanbtn{position:absolute;bottom:16px}.search{display:flex;gap:8px;margin-top:12px}.search input,.operator-input{flex:1;border:1px solid #ccc;border-radius:12px;padding:13px;font-size:16px;background:#fff}.section{margin-top:20px}.section h2{font-size:15px;margin:0 0 9px}.item{width:100%;text-align:left;background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;color:#111}.item b{display:block;font-size:14px}.meta{font-size:12px;color:#777;margin-top:3px}.stock{font-weight:700;white-space:nowrap}.price{font-size:12px;color:#555;margin-top:3px}.original{text-decoration:line-through;color:#999;margin-left:5px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 5px}.ean{font-family:monospace;color:#777}.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:18px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:20;font-size:13px;max-width:calc(100vw - 32px);text-align:center}.toast.error{background:#9d1c1c}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;padding:9px 11px}.empty{color:#888;font-size:13px;padding:10px 2px}.table-wrap{overflow:auto;background:#fff;border:1px solid #ddd;border-radius:14px}table{border-collapse:collapse;width:100%;font-size:12px;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}th{background:#fafafa;color:#666}tr:last-child td{border-bottom:0}.sale-status{font-size:11px;padding:3px 7px;border-radius:999px;background:#eaf6ed;color:#245c2c}.sale-status.cancelled{background:#eee;color:#777}.operator-row{display:flex;gap:8px;margin-top:14px}.operator-note{font-size:12px;color:#777;margin-top:8px}footer{margin-top:25px;color:#999;font-size:11px;text-align:center}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.header-actions{justify-content:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.stats .num{font-size:21px}.item{font-size:13px}}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px;max-width:520px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><h1>JOY EXTREME · WF SALES</h1><div class="sub">展会共享库存 · 扫码 / 品名 / SKU / EAN</div></div>
      <div class="header-actions">
        <button class="btn secondary small" id="operatorBtn">操作人：未设置</button>
        <button class="btn secondary small" id="syncBtn">同步</button>
        <button class="btn secondary small" id="exportBtn">导出流水</button>
      </div>
    </header>
    <div class="stats">
      <div class="card"><div class="num" id="soldN">—</div><div class="label">今日已售</div></div>
      <div class="card"><div class="num" id="revenueN">—</div><div class="label">今日销售额</div></div>
      <div class="card"><div class="num" id="remainN">—</div><div class="label">当前剩余</div></div>
      <div class="card"><div class="num" id="skuN">—</div><div class="label">商品数</div></div>
    </div>
    <div class="status syncing" id="syncStatus">正在连接共享库存…</div>
    <div class="scanner">
      <video id="video" playsinline></video>
      <div id="scanHelp">点击下方按钮，用手机摄像头读取 EAN-13</div>
      <div class="scanline"></div>
      <button class="btn scanbtn" id="scanBtn">开始扫码</button>
    </div>
    <div class="search">
      <input id="q" placeholder="输入品名 / SKU / EAN">
      <button class="btn secondary" id="clearBtn">清空</button>
    </div>
    <div class="section"><h2>商品库存</h2><div id="products"></div></div>
    <div class="section"><h2>SKU 销售概览</h2><div class="table-wrap"><table><thead><tr><th>商品</th><th>SKU</th><th>单件价</th><th>初始</th><th>已售</th><th>当前</th><th>Sell-through</th></tr></thead><tbody id="skuStats"></tbody></table></div></div>
    <div class="section"><h2>销售流水</h2><div id="sales"></div><div class="toolbar"><button class="btn secondary small" id="undoBtn">撤销上一笔</button></div></div>
    <footer>库存与销售流水来自 Supabase 共享数据库。销售结果以服务器确认成功为准。</footer>
  </div>

  <div class="modal" id="productModal"><div class="sheet"><h3 id="mName"></h3><div class="ean" id="mCode"></div><p id="mInfo"></p><div class="actions"><button class="btn secondary" id="cancelSaleBtn">取消</button><button class="btn" id="sellBtn">确认售出 1 件</button></div></div></div>
  <div class="modal" id="operatorModal"><div class="sheet"><h3>选择操作人</h3><p>每笔销售都会记录当前工作人员姓名。</p><div class="operator-row"><input class="operator-input" id="operatorInput" list="operatorOptions" maxlength="80" placeholder="输入姓名"><datalist id="operatorOptions"><option value="Victoria"><option value="员工2"><option value="员工3"><option value="员工4"></datalist></div><div class="operator-note">姓名仅保存在当前设备；库存和销售记录保存在云端。</div><div class="actions"><button class="btn secondary" id="operatorCancelBtn">取消</button><button class="btn" id="operatorSaveBtn">保存操作人</button></div></div></div>
  <div class="toast" id="toast"></div>

  <script src="./config.js"></script>
  <script src="./zxing-browser.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
